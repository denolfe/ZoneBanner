name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pin third-party actions to commit SHAs before relying on this in production
# (replace @vN with @<sha> # vN).
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lunarmodules/luacheck@v1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install busted
      - run: busted
