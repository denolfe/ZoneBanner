name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Verify variable names against https://github.com/BigWigsMods/packager before first release.
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      # WoWInterface has no Forever category; omit WOWI_API_TOKEN for Forever-only addons.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # packager builds the changelog from history
      - uses: BigWigsMods/packager@v2
